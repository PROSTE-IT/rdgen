services:
  rdgen:
    # use bryangerlach/rdgen:latest for the latest build
    #build: .
    image: bryangerlach/rdgen:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: "django-insecure-!(t-!f#6g#sr%yfded9(xha)g+=!6craeez^cp+*&bz_7vdk61"
      GHUSER: "github_username"
      GHBEARER: "github_access_token"
      GENURL: "accessible_url_of_server"
      # Optional: space- or comma-separated public origins. When omitted,
      # GENURL is used automatically.
      CSRF_TRUSTED_ORIGINS: ""
      TRUST_X_FORWARDED_PROTO: ""
      ZIP_PASSWORD: ""
      GHBRANCH: "master"
      PROTOCOL: "https"
      REPONAME: "rdgen"
      SH_SECRET: ""
      DATABASE_PATH: "/opt/rdgen/data/db.sqlite3"
      EXE_ROOT: "/opt/rdgen/exe"
      EXE_TRASH_ROOT: "/opt/rdgen/artifact_trash"
      RDGEN_DASHBOARD_TOKEN: "${RDGEN_DASHBOARD_TOKEN}"
      RDGEN_UPLOAD_TOKEN: "${RDGEN_UPLOAD_TOKEN}"
      RDBK_DOWNLOAD_CENTER_URL: "https://rdbk-admin.prosteit.pl/admin/downloads/"
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    volumes:
      - ./exe:/opt/rdgen/exe
      - ./png:/opt/rdgen/png
      - ./temp_zips:/opt/rdgen/temp_zips
      - ./artifact_trash:/opt/rdgen/artifact_trash
      - rdgen_data:/opt/rdgen/data

volumes:
  rdgen_data:
